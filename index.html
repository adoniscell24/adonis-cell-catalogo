<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adonis Cell | Catálogo digital</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#142033;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}header{background:#0b1222;color:white;text-align:center;padding:30px 15px;border-bottom:5px solid #1689ff}header h1{margin:0;font-size:38px}header h1 span{color:#38a9ff}header p{margin:6px}.wrap{max-width:1100px;margin:auto;padding:20px}.panel,.item{background:white;border-radius:18px;padding:20px;box-shadow:0 5px 18px #15274412}.filters{display:grid;grid-template-columns:2fr 1fr;gap:10px}input,select,button,textarea{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:10px;width:100%}button{cursor:pointer;background:#087bdb;color:white;border:0;font-weight:700}button:disabled{opacity:.55;cursor:wait}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0}.bar button{width:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.item{padding:0;overflow:hidden}.photo{height:190px;background:#eaf0f8;display:grid;place-items:center;color:#64748b}.photo img{width:100%;height:100%;object-fit:contain}.details{padding:16px}.details h3{margin:6px 0}.muted{color:#64748b}.price{font-size:24px;font-weight:800;margin:10px 0}.tag{font-size:12px;padding:5px 9px;border-radius:8px;background:#dcfce7;color:#166534}.tag.off{background:#fee2e2;color:#991b1b}.wa{background:#18a957;margin-top:12px}.admin{display:none;margin-bottom:18px}.admin.open{display:block}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form textarea,.form button{grid-column:1/-1}.actions{display:flex;gap:8px;margin-top:10px}.actions button{font-size:12px;padding:8px}.danger{background:#dc2626}.note{font-size:13px;color:#64748b}.empty{text-align:center;padding:30px;grid-column:1/-1}.login{max-width:460px;margin:auto}.message{padding:10px;border-radius:10px;background:#eaf0f8;margin:10px 0}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.item .photo{height:150px}.details{padding:12px}.price{font-size:20px}.form{grid-template-columns:1fr}.form textarea,.form button{grid-column:auto}}@media(max-width:400px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><img src="WhatsApp Image 2026-10-28 at 1.15.27 AM.jpeg" alt="Adonis Cell" style="width:180px;max-width:80%;height:auto;display:block;margin:0 auto 12px;"><img src="WhatsApp Image 2026-10-28 at 1.20.07 AM.jpeg" alt="Adonis Cell" style="width:180px;max-width:80%;height:auto;display:block;margin:0 auto 12px;"><h1>ADONIS <span>CELL</span></h1><p>Estilo, calidad y confianza</p><p>Catálogo digital de productos</p></header>
<main class="wrap">
<section class="panel"><h2>Encuentra tu producto</h2><div class="filters"><input id="search" placeholder="Buscar producto..."><select id="status"><option value="">Todos los estados</option><option value="true">Disponible</option><option value="false">Agotado</option></select></div><button style="margin-top:12px" onclick="clearFilters()">Limpiar filtros</button></section>
<div class="bar"><span id="count">Cargando productos...</span><button id="adminBtn" style="display:none" onclick="toggleAdmin()">⚙ Administrar</button></div>
<section class="panel admin" id="admin"><h2>Administración de productos</h2>
<div id="loginBox" class="login"><p>Acceso exclusivo del administrador.</p><form id="loginForm"><input id="email" type="email" autocomplete="username" placeholder="Correo electrónico" required style="margin-bottom:10px"><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña" required style="margin-bottom:10px"><button type="submit">Iniciar sesión</button></form></div>
<div id="editorBox" class="hidden"><p id="userLabel" class="note"></p><button style="max-width:200px;margin-bottom:15px" onclick="logout()">Cerrar sesión</button><form id="productForm" class="form"><input id="name" placeholder="Nombre del producto" required><input id="price" type="number" min="0.01" step="0.01" placeholder="Precio en RD$" required><input id="img" type="url" placeholder="URL pública de imagen (opcional)"> <input id="fotoArchivo" type="file" accept="image/*"><select id="available"><option value="true">Disponible</option><option value="false">Agotado</option></select><textarea id="description" placeholder="Descripción" rows="3"></textarea><button id="save" type="submit">Agregar producto</button><button type="button" style="background:#64748b" onclick="resetForm()">Cancelar edición</button></form></div>
<p id="adminMessage" class="note" role="status"></p></section>
<section class="grid" id="products"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const SUPABASE_URL='https://dxmpfzqexlgfoxeerbhx.supabase.co';
const SUPABASE_KEY='sb_publishable_w4Gu_bJyasiO9rzAXoL1cw_qMHln-Zq';
const ADMIN_UID='561ede05-8ace-4b32-8af4-7f575f21cdeb';
const WHATSAPP='18293604306';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let products=[],editing=null,session=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isAdmin(){return session?.user?.id===ADMIN_UID}
function showMessage(s){$('adminMessage').textContent=s}
function render(){const q=$('search').value.trim().toLowerCase(),status=$('status').value;const filtered=products.filter(p=>(String(p.nombre||'')+' '+String(p.descripcion||'')).toLowerCase().includes(q)&&(!status||String(p.disponible)===status));$('count').textContent=filtered.length+' producto(s) encontrado(s)';$('products').innerHTML=filtered.length?filtered.map(p=>{const img=p.imagen_url?`<img src="${esc(p.imagen_url)}" alt="${esc(p.nombre)}" loading="lazy" onerror="this.replaceWith(document.createTextNode('Sin imagen'))">`:'📱 Imagen pendiente';return `<article class="item"><div class="photo">${img}</div><div class="details"><h3>${esc(p.nombre)}</h3><p class="muted">${esc(p.descripcion)}</p><span class="tag ${p.disponible?'':'off'}">${p.disponible?'Disponible':'Agotado'}</span><div class="price">RD$ ${Number(p.precio||0).toLocaleString('es-DO')}</div><button class="wa" data-action="consult" data-id="${esc(p.id)}">Consultar por WhatsApp</button>${isAdmin()?`<div class="actions"><button data-action="edit" data-id="${esc(p.id)}">Editar</button><button class="danger" data-action="delete" data-id="${esc(p.id)}">Eliminar</button></div>`:''}</div></article>`}).join(''):'<p class="empty">No hay productos que coincidan.</p>'}
async function loadProducts(){const {data,error}=await db.from('productos').select('id,nombre,precio,imagen_url,disponible,descripcion').order('id',{ascending:false});if(error){$('count').textContent='No se pudieron cargar los productos';$('products').innerHTML='<p class="empty">Error al consultar el catálogo. Revisa la conexión y las políticas de lectura.</p>';console.error(error);return}products=data||[];render()}

function toggleAdmin() {
  $('admin').classList.toggle('open');

  if ($('admin').classList.contains('open')) {
    $('admin').scrollIntoView({ behavior: 'smooth' });
    updateAuthUI();
  }
}

  if (new URLSearchParams(window.location.search).get('admin') === '1') {
  window.addEventListener('DOMContentLoaded', () => {
    toggleAdmin();
  });
}

function clearFilters(){$('search').value='';$('status').value='';render()}
function updateAuthUI(){$('loginBox').classList.toggle('hidden',isAdmin());$('editorBox').classList.toggle('hidden',!isAdmin());$('userLabel').textContent=isAdmin()?'Sesión de administrador: '+session.user.email:'';render()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();showMessage('Iniciando sesión...');const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error){showMessage('No se pudo iniciar sesión: '+error.message);return}session=data.session;if(!isAdmin()){await db.auth.signOut();session=null;showMessage('Esta cuenta no tiene permiso de administración.');updateAuthUI();return}showMessage('Sesión iniciada.');updateAuthUI()});
async function logout(){await db.auth.signOut();session=null;resetForm();showMessage('Sesión cerrada.');updateAuthUI()}
function resetForm(){editing=null;$('productForm').reset();$('save').textContent='Agregar producto'}

async function subirFotoProducto() {
  const archivo = $('fotoArchivo').files[0];
  if (!archivo) return null;

  if (!archivo.type.startsWith('image/')) {
    throw new Error('Selecciona una imagen válida.');
  }

  const extension = archivo.name.split('.').pop().toLowerCase();
  const ruta = `${crypto.randomUUID()}.${extension}`;

  const { data, error } = await db.storage
    .from('productos-imagenes')
    .upload(ruta, archivo, {
      contentType: archivo.type
    });

  if (error) throw error;

  const { data: urlData } = db.storage
    .from('productos-imagenes')
    .getPublicUrl(data.path);

  return urlData.publicUrl;
}

$('productForm').addEventListener('submit',async e=>{e.preventDefault();if(!isAdmin()){showMessage('Acceso denegado.');return}const nombre=$('name').value.trim(),precio=Number($('price').value);if(!nombre||!Number.isFinite(precio)||precio<=0){showMessage('Completa nombre y precio válido.');return}const payload={nombre,precio,imagen_url:await subirFotoProducto(),disponible:$('available').value==='true',descripcion:$('description').value.trim()};$('save').disabled=true;const result=editing===null?await db.from('productos').insert(payload):await db.from('productos').update(payload).eq('id',editing);$('save').disabled=false;if(result.error){showMessage('No se pudo guardar: '+result.error.message);return}resetForm();showMessage('Producto guardado correctamente.');await loadProducts()});
function consult(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;const message='Hola, me interesa '+p.nombre+' de Adonis Cell (RD$ '+Number(p.precio||0).toLocaleString('es-DO')+'). ¿Está disponible?';window.open('https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(message),'_blank','noopener,noreferrer')}
function editProduct(id){if(!isAdmin())return;const p=products.find(x=>String(x.id)===String(id));if(!p)return;editing=p.id;$('name').value=p.nombre||'';$('price').value=p.precio??'';$('img').value=p.imagen_url||'';$('available').value=String(!!p.disponible);$('description').value=p.descripcion||'';$('save').textContent='Guardar cambios';$('admin').classList.add('open');$('admin').scrollIntoView({behavior:'smooth'})}
async function deleteProduct(id){if(!isAdmin()||!confirm('¿Eliminar este producto?'))return;const {error}=await db.from('productos').delete().eq('id',id);if(error){showMessage('No se pudo eliminar: '+error.message);return}showMessage('Producto eliminado.');await loadProducts()}
$('products').addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;const {action,id}=btn.dataset;if(action==='consult')consult(id);else if(action==='edit')editProduct(id);else if(action==='delete')deleteProduct(id)});
$('search').addEventListener('input',render);$('status').addEventListener('change',render);
db.auth.onAuthStateChange((_event,s)=>{session=s;updateAuthUI()});
(async()=>{const {data}=await db.auth.getSession();session=data.session;updateAuthUI();await loadProducts()})();
</script>
</body></html>
